name: VPS deployment preflight

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Read VPS status only; do not synchronize files or start containers
        type: boolean
        required: false
        default: false
      docker_disk_inventory:
        description: Read-only Docker disk/image inventory; overrides deployment preflight
        type: boolean
        required: false
        default: false
      cleanup_reviewed_library_images:
        description: Remove only the 17 reviewed unused Library images; preserves containers/volumes/rollback
        type: boolean
        required: false
        default: false
      reclaim_seaweed_preallocation:
        description: Approved backed-up SeaweedFS maintenance; pauses storage/worker and checks every object
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Check production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/quanlythuvien_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/quanlythuvien_deploy" "$HOME/.ssh/known_hosts"

      - name: Read production status without modifying the VPS
        if: ${{ inputs.diagnostic_only && !inputs.docker_disk_inventory && !inputs.cleanup_reviewed_library_images && !inputs.reclaim_seaweed_preallocation }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh_args=(
            -i "$HOME/.ssh/quanlythuvien_deploy"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" 'bash -s' < deploy/scripts/status.sh

      - name: Inventory Docker disk without deleting or changing data
        if: ${{ inputs.docker_disk_inventory && !inputs.cleanup_reviewed_library_images && !inputs.reclaim_seaweed_preallocation }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$HOME/.ssh/quanlythuvien_deploy" -p "$VPS_PORT"
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" 'bash -s' < deploy/scripts/docker-disk-inventory.sh

      - name: Require exact-revision CI before destructive maintenance
        if: ${{ inputs.cleanup_reviewed_library_images || inputs.reclaim_seaweed_preallocation }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          approved=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/backend-ci.yml/runs?head_sha=$GITHUB_SHA&event=pull_request&per_page=10" \
            --jq '.workflow_runs | any(.status == "completed" and .conclusion == "success")')
          [[ "$approved" == true ]]

      - name: Remove only reviewed unused Library image references
        if: ${{ inputs.cleanup_reviewed_library_images && !inputs.reclaim_seaweed_preallocation }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$HOME/.ssh/quanlythuvien_deploy" -p "$VPS_PORT"
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" 'bash -s' < deploy/scripts/cleanup-reviewed-library-images.sh

      - name: Back up and reclaim reviewed SeaweedFS beyond-EOF allocation
        if: ${{ inputs.reclaim_seaweed_preallocation }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$HOME/.ssh/quanlythuvien_deploy" -p "$VPS_PORT"
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          remote="${VPS_USER}@${VPS_HOST}"
          remote_dir="/tmp/library-seaweed-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -C deploy/scripts -czf - reclaim-seaweed-preallocation.sh reclaim-seaweed-preallocation.py seaweed-object-snapshot.py | \
            ssh "${ssh_args[@]}" "$remote" "umask 077; mkdir -m 700 '$remote_dir'; tar -xzf - -C '$remote_dir'"
          ssh "${ssh_args[@]}" "$remote" \
            "LIBRARY_MAINTENANCE_RUN='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' bash '$remote_dir/reclaim-seaweed-preallocation.sh'"

      - name: Connect and synchronize deployment assets
        if: ${{ !inputs.diagnostic_only && !inputs.docker_disk_inventory && !inputs.cleanup_reviewed_library_images && !inputs.reclaim_seaweed_preallocation }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh_args=(
            -i "$HOME/.ssh/quanlythuvien_deploy"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          remote="${VPS_USER}@${VPS_HOST}"
          ssh "${ssh_args[@]}" "$remote" 'printf "SSH connection: OK\n"'
          tar -C deploy -czf - . | ssh "${ssh_args[@]}" "$remote" \
            'umask 077; mkdir -p "$HOME/apps/quanlythuvien"; tar -xzf - -C "$HOME/apps/quanlythuvien"'
          ssh "${ssh_args[@]}" "$remote" 'bash ~/apps/quanlythuvien/scripts/preflight.sh --database'
