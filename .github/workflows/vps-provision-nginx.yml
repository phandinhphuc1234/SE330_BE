name: Provision Nginx HTTP entry point

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROVISION_NGINX to install or update Nginx on the VPS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quanlythuvien-production
  cancel-in-progress: false

jobs:
  provision-nginx:
    name: Install and configure Nginx
    if: ${{ inputs.confirmation == 'PROVISION_NGINX' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/quanlythuvien_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/quanlythuvien_deploy" "$HOME/.ssh/known_hosts"

      - name: Synchronize deployment assets and configure Nginx
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$VPS_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
            echo 'VPS_HOST must be an IPv4 address for the domainless HTTP setup.' >&2
            exit 1
          }

          ssh_args=(
            -i "$HOME/.ssh/quanlythuvien_deploy"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          remote="${VPS_USER}@${VPS_HOST}"
          tar -C deploy -czf - . | ssh "${ssh_args[@]}" "$remote" \
            'umask 077; mkdir -p "$HOME/apps/quanlythuvien"; tar -xzf - -C "$HOME/apps/quanlythuvien"'

          public_host_b64="$(printf '%s' "$VPS_HOST" | base64 -w 0)"
          ssh "${ssh_args[@]}" "$remote" \
            "PUBLIC_HOST=\$(printf '%s' '$public_host_b64' | base64 -d) bash ~/apps/quanlythuvien/scripts/provision-nginx.sh"

      - name: Verify Nginx from the public Internet
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            --retry-delay 5 --max-time 15 "http://${VPS_HOST}/healthz"

      - name: Publish Nginx summary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          {
            echo '## Nginx HTTP entry point'
            echo "- Public health: \`http://${VPS_HOST}/healthz\`"
            echo '- Backend remains bound to `127.0.0.1:8080`'
            echo '- PostgreSQL and Redis remain private Docker services'
            echo '- HTTPS is the next step; do not send real credentials over HTTP'
          } >> "$GITHUB_STEP_SUMMARY"
