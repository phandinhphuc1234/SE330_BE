services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-rag_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      library-platform-net:
        aliases:
          - rag-postgres-exporter

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      default:
      library-platform-net:
        aliases:
          - rag-redis-exporter

networks:
  library-platform-net:
    external: true
