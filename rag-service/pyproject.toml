[tool.poetry]
name = "professional-rag-platform"
version = "0.1.0"
description = "Professional RAG platform backend scaffold"
authors = ["RAG Platform Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.141.0,<0.142.0"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.14"
pydantic = "^2.9"
pydantic-settings = "^2.6"
qdrant-client = "^1.12"
openai = "^1.57"
google-genai = "^1.75"
llama-index-llms-google-genai = "^0.8"
python-dotenv = "^1.0"
tiktoken = "^0.8"
python-docx = "^1.1"
beautifulsoup4 = "^4.12"
lxml = ">=6.1.0,<7.0"
langchain-text-splitters = "^0.3"
celery = { extras = ["redis"], version = "^5.4" }
structlog = "^24.4"
slowapi = "^0.1"
httpx = ">=0.28.1,<1.0.0"
boto3 = "^1.35"
pymupdf4llm = "^1.28.0"
pypdf = ">=6.19.0,<7.0"
llama-index-readers-file = "^0.6.0"
llama-index-vector-stores-qdrant = "^0.10.2"

# Security floors for runtime transitive dependencies. Keep them in the main
# group so --only main installs the patched versions from poetry.lock too.
aiohttp = ">=3.14.3,<4.0"
anyio = ">=4.14.2,<5.0"
cryptography = ">=50.0.0,<51.0"
fsspec = ">=2026.6.0,<2027.0"
langsmith = ">=0.8.18,<0.9.0"
nltk = ">=3.10.3,<4.0"
pillow = ">=12.3.0,<13.0"
pyasn1 = ">=0.6.4,<0.7"
setuptools = ">=84.0.0,<85.0"
starlette = ">=1.3.1,<2.0"
urllib3 = ">=2.8.0,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
factory-boy = "^3.3"

[tool.poetry.group.eval.dependencies]
ragas = "^0.2"
# The old eval-only constraint capped the shared runtime fsspec at 2025.3.0.
datasets = ">=5.1.0,<6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
