# Context/security integration tests own their PostgreSQL and Redis containers.
# Flyway is intentionally disabled here: V22 is a historical data-fix migration that
# requires the approved demo snapshot, not a blank database. Migration verification
# remains a separate snapshot-based check.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.task.scheduling.enabled=false
spring.docker.compose.enabled=false
spring.mail.test-connection=false
app.rag.enabled=false
app.payment.vnpay.enabled=false
