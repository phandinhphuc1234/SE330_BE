# Production is served only through the trusted reverse proxy on the VPS.
server.forward-headers-strategy=framework

# Let in-flight requests finish when Docker replaces the container.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# A production database must carry the approved Flyway history, including V22.
spring.flyway.baseline-on-migrate=false

# Keep documentation private by default. Enable deliberately when needed.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Only the health endpoint is exposed by default. Monitoring can opt in explicitly.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Email delivery is optional. Do not make the whole container unhealthy when no
# Resend credential is configured; enable this explicitly after mail is ready.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
