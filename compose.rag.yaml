# Optional RAG stack for the QuanLyThuVien monorepo.
#
# Run the core backend and RAG together:
#   docker compose -f compose.yaml -f compose.rag.yaml up -d --build
#
# Also run Celery Beat when scheduled RAG jobs are needed:
#   docker compose -f compose.yaml -f compose.rag.yaml --profile rag-scheduled-jobs up -d --build
#
# The RAG API is bound to loopback for local diagnostics only. Spring Boot calls
# it through Docker DNS at http://rag-api:8000. Production must not publish the
# RAG API, Qdrant, PostgreSQL, or Redis directly to the Internet.

x-rag-database-environment: &rag-database-environment
  POSTGRES_URL: postgresql+asyncpg://${RAG_POSTGRES_USER:-rag_user}:${RAG_POSTGRES_PASSWORD:-rag_password}@rag-postgres:5432/${RAG_POSTGRES_DB:-rag_db}
  POSTGRES_URL_SYNC: postgresql://${RAG_POSTGRES_USER:-rag_user}:${RAG_POSTGRES_PASSWORD:-rag_password}@rag-postgres:5432/${RAG_POSTGRES_DB:-rag_db}

x-rag-bucket-environment: &rag-bucket-environment
  OBJECT_STORAGE_ENDPOINT: http://rag-seaweedfs:8333
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-admin}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-secret}
  LIBRARY_EBOOK_BUCKET: ${LIBRARY_EBOOK_BUCKET:-library-private}
  LIBRARY_TEMP_BUCKET: ${LIBRARY_TEMP_BUCKET:-library-temp}
  RAG_ARTIFACT_BUCKET: ${RAG_ARTIFACT_BUCKET:-rag-artifacts}

x-rag-app-environment: &rag-app-environment
  <<: [*rag-database-environment, *rag-bucket-environment]
  APP_ENV: ${RAG_APP_ENV:-development}
  APP_DEBUG: ${RAG_APP_DEBUG:-false}
  LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
  LOG_JSON: ${RAG_LOG_JSON:-false}
  ENABLE_API_DOCS: ${RAG_ENABLE_API_DOCS:-false}
  RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY:?RAG_INTERNAL_API_KEY is required when the RAG profile is enabled}
  STORAGE_BACKEND: ${RAG_STORAGE_BACKEND:-s3}
  STORAGE_LOCAL_PATH: ${RAG_STORAGE_LOCAL_PATH:-./data/uploads}
  RAG_SOURCE_BUCKET: ${RAG_SOURCE_BUCKET:-library-private}
  REDIS_URL: redis://rag-redis:6379/0
  CELERY_BROKER_URL: redis://rag-redis:6379/0
  CELERY_RESULT_BACKEND: redis://rag-redis:6379/0
  QDRANT_URL: http://rag-qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-rag_chunks}

x-rag-app-image: &rag-app-image
  image: quanlythuvien-rag:local
  build:
    context: ./rag-service
    dockerfile: infra/docker/Dockerfile.api
  env_file:
    - path: ./rag-service/.env
      required: false

services:
  # Extends the Spring service declared by compose.yaml. The browser continues
  # to call Spring Boot; only Spring Boot can call the private RAG API.
  library-service:
    environment:
      RAG_ENABLED: "true"
      RAG_SERVICE_URL: http://rag-api:8000
      RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY:?RAG_INTERNAL_API_KEY is required when the RAG profile is enabled}
      OBJECT_STORAGE_ENDPOINT: http://rag-seaweedfs:8333
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:8333}

  rag-api:
    <<: *rag-app-image
    restart: unless-stopped
    environment: *rag-app-environment
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${LIBRARY_BIND_ADDRESS:-127.0.0.1}:${RAG_API_PORT:-8000}:8000"
    volumes:
      - ./rag-service/app:/app/app
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      rag-redis:
        condition: service_healthy
      rag-qdrant:
        condition: service_healthy
      rag-seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rag-worker:
    <<: *rag-app-image
    restart: unless-stopped
    environment: *rag-app-environment
    command: celery -A app.jobs.celery_app worker --loglevel=info
    volumes:
      - ./rag-service/app:/app/app
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      rag-redis:
        condition: service_healthy
      rag-qdrant:
        condition: service_healthy
      rag-seaweedfs-init:
        condition: service_completed_successfully

  rag-beat:
    <<: *rag-app-image
    profiles: ["rag-scheduled-jobs"]
    restart: unless-stopped
    environment: *rag-app-environment
    command: celery -A app.jobs.celery_app beat --loglevel=info
    volumes:
      - ./rag-service/app:/app/app
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      rag-redis:
        condition: service_healthy

  rag-migrate:
    <<: *rag-app-image
    restart: "no"
    environment: *rag-database-environment
    command: alembic upgrade head
    depends_on:
      rag-postgres:
        condition: service_healthy

  rag-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RAG_POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-rag_password}
    ports:
      - "${LIBRARY_BIND_ADDRESS:-127.0.0.1}:${RAG_POSTGRES_PORT:-5433}:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${LIBRARY_BIND_ADDRESS:-127.0.0.1}:${RAG_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    ports:
      - "${LIBRARY_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${LIBRARY_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - rag_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rag-seaweedfs:
    image: chrislusf/seaweedfs:3.85
    restart: unless-stopped
    command: >-
      server -ip=rag-seaweedfs -ip.bind=0.0.0.0 -dir=/data
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -filer -filer.port=8888 -master.port=9333 -volume.port=8080
    configs:
      - source: rag-seaweedfs-s3-config
        target: /etc/seaweedfs/s3.json
    ports:
      - "${LIBRARY_BIND_ADDRESS:-127.0.0.1}:${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - rag_seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  rag-seaweedfs-init:
    image: amazon/aws-cli:2.17.57
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws_s3() {
          aws --endpoint-url "$${OBJECT_STORAGE_ENDPOINT}" \
            --cli-connect-timeout 2 \
            --cli-read-timeout 5 \
            "$$@"
        }

        attempt=0
        until aws_s3 s3api list-buckets >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$${attempt}" -ge 30 ]; then
            echo "SeaweedFS S3 did not become ready in time" >&2
            exit 1
          fi
          sleep 2
        done

        for bucket in "$${LIBRARY_EBOOK_BUCKET}" "$${LIBRARY_TEMP_BUCKET}" "$${RAG_ARTIFACT_BUCKET}"; do
          aws_s3 s3api head-bucket --bucket "$${bucket}" >/dev/null 2>&1 ||
          aws_s3 s3api create-bucket --bucket "$${bucket}"
        done
    environment:
      <<: *rag-bucket-environment
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-secret}
      AWS_DEFAULT_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      rag-seaweedfs:
        condition: service_healthy

volumes:
  rag_postgres_data:
  rag_qdrant_data:
  rag_seaweedfs_data:

configs:
  rag-seaweedfs-s3-config:
    content: |
      {
        "identities": [
          {
            "name": "rag-platform",
            "credentials": [
              {
                "accessKey": "${OBJECT_STORAGE_ACCESS_KEY:-admin}",
                "secretKey": "${OBJECT_STORAGE_SECRET_KEY:-secret}"
              }
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }
