# Flyway migrations target PostgreSQL. These two Oracle PL/SQL rules produce
# invalid guidance for PostgreSQL (for example, replacing VARCHAR with VARCHAR2)
# or flag intentional one-time data backfills. Other SQL rules remain enabled.
sonar.issue.ignore.multicriteria=postgresBackfill,postgresVarchar

sonar.issue.ignore.multicriteria.postgresBackfill.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.postgresBackfill.resourceKey=src/main/resources/db/migration/**

sonar.issue.ignore.multicriteria.postgresVarchar.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.postgresVarchar.resourceKey=src/main/resources/db/migration/**
