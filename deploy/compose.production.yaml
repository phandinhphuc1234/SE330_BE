x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE}
    command:
      - sh
      - -ceu
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  library-service:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable GHCR image reference}
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file:
      - ${RUNTIME_ENV_FILE}
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?timezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENV: production
    ports:
      - "127.0.0.1:${LIBRARY_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 8
    stop_grace_period: 45s
    logging: *default-logging
    mem_limit: ${APP_MEMORY_LIMIT:-1024m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: quanlythuvien-production
