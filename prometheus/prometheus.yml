# Prometheus configuration for the standalone library demo.
# It intentionally scrapes only services declared by this repository. RAG can be
# monitored from its own deployment when that optional integration is enabled.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor chính Prometheus.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          application: prometheus
          environment: local

  # Spring Boot backend.
  - job_name: library-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - library-service:8080
        labels:
          application: library-service
          environment: local
          service_group: spring
